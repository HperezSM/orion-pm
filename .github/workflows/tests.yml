name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Lovable keeps bun.lock current; package-lock.json lags behind.
      - run: bun install --frozen-lockfile
      - run: npm i --no-save --no-audit --no-fund @electric-sql/pglite@0.5.16
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Unit tests (vitest)
        run: npm test
      - name: Database tests (PGlite)
        run: npm run test:db
      - name: Edge function tests (Deno)
        run: npm run test:functions
      - name: Build
        run: npm run build
